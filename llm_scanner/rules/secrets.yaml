# Signature rules for secret_leakage: known credential formats. The format
# alone is a strong enough signal here -- no extra validation needed.
#
# Fuzzier cases (random unlabeled tokens, credit-card-shaped digit runs) need
# real logic (entropy, Luhn checksum), not just a pattern -- those live in
# detectors/secrets.py instead.

- id: sec_aws_access_key
  category: secret_leakage
  pattern: '\bAKIA[0-9A-Z]{16}\b'
  weight: 0.9
  description: AWS access key ID format
  examples:
    - "AKIAIOSFODNN7EXAMPLE"
  counter_examples:
    - "AKIA is an acronym some companies use internally"

- id: sec_openai_key
  category: secret_leakage
  pattern: '\bsk-[A-Za-z0-9]{20,}\b'
  weight: 0.85
  description: OpenAI-style secret key format
  examples:
    - "sk-EXAMPLEFAKEKEY1234567890ABCDEFGHIJ"
  counter_examples:
    - "the ski-touring season starts in December"

- id: sec_jwt
  category: secret_leakage
  pattern: '\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'
  weight: 0.8
  description: JSON Web Token (JWT) structure
  examples:
    - "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.dGhpc2lzYWZha2VzaWduYXR1cmU"
  counter_examples:
    - "please send me your feedback by email"

- id: sec_private_key_header
  category: secret_leakage
  pattern: '-----BEGIN\s+(RSA\s+|EC\s+|OPENSSH\s+)?PRIVATE\s+KEY-----'
  weight: 0.9
  description: PEM private key header
  examples:
    - "-----BEGIN RSA PRIVATE KEY-----"
    - "-----BEGIN PRIVATE KEY-----"
  counter_examples:
    - "please keep this information private and confidential"
